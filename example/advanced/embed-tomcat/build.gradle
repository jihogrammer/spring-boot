plugins {
    id 'java'
}

group = 'dev.jihogrammer.spring-boot'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework:spring-webmvc:6.0.4'
    implementation 'org.apache.tomcat.embed:tomcat-embed-code:10.1.5'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('buildCommonJar', Jar) {
    manifest {
        attributes 'Main-Class': 'dev.jihogrammer.springboot.embed.EmbedTomcatApplication'
    }
    with jar as Closure<Object>
}

tasks.register('buildFatJar', Jar) {
    manifest {
        attributes 'Main-Class': 'dev.jihogrammer.springboot.embed.EmbedTomcatApplication'
    }
    duplicatesStrategy = DuplicatesStrategy.WARN
    from {
        configurations.runtimeClassPath.collect {
            it.isDirectory() ? it : zipTree('')
        }
    }
    with jar as Closure<Object>
}
