<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>File Storage</title>
  <meta charset="UTF-8">
</head>

<body>
<h1>Item View</h1>

<main th:object="${item}">
  <h2>#<span th:text="*{id}"></span> <span th:text="*{name}"></span></h2>

  <div th:if="*{mainFile}">
    <h3 th:text="*{mainFile.name}"></h3>
    <a th:href="|/file-storage/items/files/*{id}|">download</a>
  </div>

  <div th:if="*{subFiles}">
    <div>
      <a
        th:each="imageFile : *{subFiles}"
        th:href="|/file-storage/items/images/${imageFile.storedName}|"
        target="_blank"
      >
        <img
          alt="a image file"
          src=""
          th:src="|/file-storage/items/images/${imageFile.storedName}|"
          style="width: 90vw"
        >
      </a>
    </div>
  </div>

</main>
</body>

</html>
