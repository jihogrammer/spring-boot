<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register :: Product</title>
</head>
<body>
<h1>ProductSave</h1>

<h4><a href="/">main</a></h4>

<form method="POST" th:object="${payload}">
  <table>
    <tr>
      <th>NAME</th>
      <td>
        <label>
          <input type="text" th:field="*{name}">
        </label>
      </td>
    </tr>
    <tr>
      <th>PRICE</th>
      <td>
        <label>
          <input type="number" th:field="*{price}">
        </label>
      </td>
    </tr>
    <tr>
      <th>QUANTITY</th>
      <td>
        <label>
          <input type="number" th:field="*{quantity}">
        </label>
      </td>
    </tr>
    <tr>
      <th>OPEN</th>
      <td>
        <label>
          <input type="checkbox" th:field="*{open}"> open
        </label>
      </td>
    </tr>
    <tr>
      <th>REGIONS</th>
      <td>
        <label th:each="region : ${regions}">
          <input type="checkbox" th:field="*{regions}" th:value="${region.key}">
          <span th:text="${region.description}"></span>
        </label>
      </td>
    </tr>
    <tr>
      <th>PRODUCT TYPE</th>
      <td>
        <label th:each="type : ${types}">
          <input type="radio" th:field="*{type}" th:value="${type.key}">
          <span th:text="${type.description}"></span>
        </label>
      </td>
    </tr>
    <tr>
      <th>DELIVERY CODE</th>
      <td>
        <label>
          <select th:field="*{deliveryType}">
            <option value="">=== 배송 방식 선택 ===</option>
            <option
              th:each="deliveryType : ${deliveryTypes}"
              th:value="${deliveryType.key}"
              th:text="${deliveryType.description}">
            </option>
          </select>
        </label>
      </td>
    </tr>
    <tr>
      <th><input type="submit"></th>
      <td><input type="button" value="cancel" onclick="location.href='/'"></td>
    </tr>
  </table>
</form>
</body>
</html>
