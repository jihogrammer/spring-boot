<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Item</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>

<body>
  <h1>Register item</h1>

  <nav>
    <button onclick="location.href = '/items'">cancel</button>
  </nav>

  <form method="post" th:object="${payload}">
    <table>
      <tbody>
      <tr>
        <th>NAME</th>
        <td>
          <label>
            <input th:field="*{name}" type="text">
          </label>
        </td>
      </tr>
      <tr>
        <th>PRICE</th>
        <td>
          <label>
            <input th:field="*{price}" type="number">
          </label>
        </td>
      </tr>
      <tr>
        <th>QUANTITY</th>
        <td>
          <label>
            <input th:field="*{quantity}" type="number">
          </label>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <label>
            <input type="submit">
          </label>
        </td>
      </tr>
      </tbody>
    </table>
  </form>
</body>

</html>
