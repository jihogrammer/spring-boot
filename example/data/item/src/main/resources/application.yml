server:
  port: 7777

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:item;DB_CLOSE_DELAY=-1
    username: sa
    initialization-mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  type-aliases-package: dev.jihogrammer.item.adaptor.mybatis
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    dev.jihogrammer.item.adaptor.mybatis: TRACE
