<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Sign Up :: Members</title>
</head>

<body>
<header>
  <h1>Sign Up</h1>
</header>

<main>
  <form th:action method="post" th:object="${signUpPayload}">
    <table>
      <tr th:if="${#fields.hasGlobalErrors()}">
        <td colspan="2">
          <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </td>
      </tr>
      <tr>
        <th>Username</th>
        <td>
          <label>
            <input type="text" th:field="*{username}" th:errorclass="error">
          </label>
          <p class="error" th:errors="*{username}"></p>
        </td>
      </tr>
      <tr>
        <th>Password</th>
        <td>
          <label>
            <input type="password" th:field="*{password}" th:errorclass="error">
          </label>
          <p class="error" th:errors="*{password}"></p>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <div class="button-group">
            <input type="button" value="cancel" onclick="location.href='/'">
            <input type="submit" value="Sign Up">
          </div>
        </td>
      </tr>
    </table>
  </form>
</main>
</body>
</html>
