<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${title}"></title>
</head>

<body>
<h1 th:text="${title}"></h1>

<h3 th:unless="${member == null}">
  Hello, <span th:text="${member.username}"></span>!
</h3>

<ul>
  <li th:each="uri : ${uris}">
    <a th:href="|${uri}|" th:text="${uri}"></a>
  </li>
</ul>
</body>
</html>
